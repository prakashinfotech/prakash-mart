server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;


    # ========================================================
    # React / Vite SPA
    # ========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # ========================================================
    # Static assets
    # ========================================================

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf)$ {
        try_files $uri =404;

        access_log off;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";
    }
}
