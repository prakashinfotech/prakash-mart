name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run all tests ────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore backend/PrakashMart.sln

      - name: Build backend
        run: dotnet build backend/PrakashMart.sln --no-restore --configuration Release

      - name: Run backend unit tests
        run: dotnet test backend/tests/Application.Tests/Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  # ── Job 2: Build Docker images (runs after tests pass) ──────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: prakashmart-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: prakashmart-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
