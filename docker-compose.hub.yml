services:

  # ── SQL Server ────────────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -b -C -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── .NET Backend ─────────────────────────────────────────────────────────────
  backend:
    image: dongavipul/prakashmart-backend:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Server=db;Database=prakashmart;User Id=sa;Password=${DB_PASSWORD};
        TrustServerCertificate=True;MultipleActiveResultSets=true
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: PrakashMart
      Jwt__Audience: PrakashMartApp
      Jwt__ExpiryMinutes: "10080"
      Cors__AllowedOrigins__0: "http://localhost"
      App__FrontendUrl: "http://localhost"
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── React Frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    image: dongavipul/prakashmart-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqldata:
